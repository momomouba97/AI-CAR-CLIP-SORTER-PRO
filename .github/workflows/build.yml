name: Build Mac Intel App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Mac application
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          pyinstaller --noconfirm --windowed \
            --name "AICarClipSorter" \
            --collect-all cv2 \
            main.py

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/AICarClipSorter.app \
            AICarClipSorter-Mac-Intel.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: AI-CAR-CLIP-SORTER-MAC
          path: AICarClipSorter-Mac-Intel.zip
