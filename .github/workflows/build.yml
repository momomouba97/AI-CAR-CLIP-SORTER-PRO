
name: Build Mac Intel App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          pyinstaller --noconfirm --windowed \
            --name "AICarClipSorterPRO" \
            --collect-all cv2 \
            --collect-all scenedetect \
            --collect-all imageio_ffmpeg \
            --hidden-import=PIL._tkinter_finder \
            main.py

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/AICarClipSorterPRO.app \
            AICarClipSorterPRO-Mac-Intel.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: AI-CAR-CLIP-SORTER-PRO-MAC-INTEL
          path: AICarClipSorterPRO-Mac-Intel.zip
